    <style>
        :root {
            --primary-color: #004494;
            --shabbat-bg: #f0f7ff;
            --holiday-color: #c52222;
            --border-color: #c9c9c9;
            --memorial-color: #1e293b;
            --anniversary-color: #6b21a8;
            --birthday-color: #047857;
            --quote-bg: #f8fafc;
            --quote-border: #004494;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #e9ecef;
            margin: 0;
            padding: 0;
            color: #333;
        }

        @page {
            size: A4 landscape;
            margin: 0;
        }

        html, body {
            margin: 0;
            padding: 0;
            background-color: #e9ecef;
            height: 100%;
        }

        .calendar-page {
            background: #fff;
            width: 29.7cm;
            height: 21cm;
            max-height: 21cm;
            margin: 0 auto;
            padding: 0.25cm 0.4cm;
            box-sizing: border-box;
            page-break-after: always;
            break-after: page;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-right: 4px;
            padding-left: 4px;
            margin-bottom: 3px;
            border-bottom: 2px solid var(--primary-color);
            padding-bottom: 3px;
            flex-shrink: 0;
            gap: 12px;
        }

        .header-title-container {
            text-align: right;
            flex-shrink: 0;
        }

        .page-header h1 {
            margin: 0 0 2px 0;
            font-size: 1.5rem;
            display: flex;
            align-items: baseline;
            gap: 8px;
        }

        .month-name {
            color: var(--primary-color);
            font-weight: bold;
        }

        .year {
            color: #c05621;
            font-size: 0.95rem;
            font-weight: bold;
        }

        .page-header .gregorian-months {
            font-size: 0.58rem;
            color: #64748b;
            font-weight: 500;
        }

        .quote-box {
            flex: 1;
            background-color: var(--quote-bg);
            border: 1px solid #e2e8f0;
            border-right: 3px solid var(--quote-border);
            border-radius: 6px;
            padding: 3px 10px;
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            gap: 8px;
            text-align: center;
            box-shadow: 0 1px 2px rgba(0,0,0,0.03);
            box-sizing: border-box;
            max-height: 48px;
            overflow: hidden;
            white-space: nowrap;
            font-family: 'SBL Hebrew', 'Times New Roman', serif;
        }

        .quote-text {
            font-size: 1.05rem;
            color: #0f172a;
            font-weight: 700;
            line-height: 1.1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .quote-source {
            font-size: 0.85rem;
            color: #475569;
            font-weight: 600;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .month-symbol-container {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f8fafc;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            padding: 3px 8px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            flex-shrink: 0;
        }

        .month-symbol-svg {
            width: 40px;
            height: 40px;
            display: block;
            flex-shrink: 0;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            grid-template-rows: auto repeat(6, 1fr);
            flex-grow: 1;
            border-top: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color);
            position: relative;
            height: 100%;
            box-sizing: border-box;
        }

        .weekday-header {
            background-color: var(--primary-color);
            color: white;
            font-weight: bold;
            text-align: center;
            padding: 3px 0;
            border-left: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
            font-size: 0.9rem;
            position: relative;
            z-index: 1;
        }

        .day-cell {
            border-left: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
            padding: 2px 3px;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 1;
            overflow: hidden;
            box-sizing: border-box;
        }

        .day-cell.empty {
            background-color: rgba(249, 249, 249, 0.85);
        }

        .day-cell.shabbat {
            background-color: rgba(240, 247, 255, 0.9);
        }

        .day-cell.shabbat .hebrew-date {
            color: var(--primary-color);
        }

        .date-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1px;
            flex-shrink: 0;
        }

        .hebrew-date {
            font-size: 0.95rem;
            font-weight: bold;
        }

        .gregorian-date {
            font-size: 0.7rem;
            color: #555;
            font-weight: 600;
        }

        .holiday {
            font-size: 0.85rem;
            color: var(--holiday-color);
            font-weight: bold;
            text-align: center;
            margin-top: 1px;
            line-height: 1.2;
            flex-shrink: 0;
            word-break: normal;
            overflow-wrap: break-word;
            white-space: normal;
        }

        .parasha {
            font-size: 0.92rem;
            color: #0b5394;
            font-weight: bold;
            text-align: center;
            margin-top: auto;
            padding-top: 1px;
            line-height: 1.2;
            flex-shrink: 0;
            word-break: normal;
            overflow-wrap: break-word;
            white-space: normal;
        }

        .events-container {
            display: flex;
            flex-direction: column;
            gap: 2px;
            margin-top: 1px;
            overflow: hidden;
            flex-grow: 1;
        }

        .event-badge {
            font-size: 0.8rem;
            padding: 1px 4px;
            border-radius: 3px;
            display: block;
            font-weight: 700;
            line-height: 1.2;
            white-space: normal;
            word-break: normal;
            overflow-wrap: break-word;
            flex-shrink: 0;
            box-sizing: border-box;
        }

        .years-count {
            font-size: 0.7rem;
            font-weight: 400;
            opacity: 0.9;
            margin-right: 2px;
        }

        .memorial-badge {
            background-color: #f1f5f9;
            color: var(--memorial-color);
            border-right: 3px solid #475569;
        }

        .anniversary-badge {
            background-color: #faf5ff;
            color: var(--anniversary-color);
            border-right: 3px solid #a855f7;
        }

        .birthday-badge {
            background-color: #ecfdf5;
            color: var(--birthday-color);
            border-right: 3px solid #10b981;
        }

        @media print {
            body {
                background: none;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            .calendar-page {
                margin: 0 !important;
                padding: 0.25cm 0.4cm !important;
                width: 29.7cm !important;
                height: 21cm !important;
                max-height: 21cm !important;
                box-shadow: none !important;
                border: none !important;
                page-break-after: always !important;
                break-after: page !important;
                page-break-inside: avoid !important;
                break-inside: avoid !important;
            }
        }
    </style>
</head>
